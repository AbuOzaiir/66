<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SixtySix · Dateien</title><link rel="stylesheet" href="/style.css"></head><body>
<header><strong><span class="mark">66</span> SIXTY SIX STUDIOS</strong><span class="divider"></span><span>Dateien</span><div class="spacer"></div><span id="status" role="status">Verbinden …</span><a id="login" class="loginButton" href="/api/login">Mit Google anmelden</a><button id="add">+ Datei</button></header>
<main><aside id="tree" aria-label="Ordnerstruktur"></aside><section id="canvas" aria-label="Dateidiagramm"><div id="world"><svg id="edges" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca4b9"/></marker></defs><g id="lines"></g></svg><div id="nodes"></div></div><div id="canvasHint">Dateien ziehen · Doppelklick zum Öffnen · Verbindung am Rand ziehen</div><div class="zoom"><button id="minus" aria-label="Verkleinern">−</button><span id="scale">100%</span><button id="plus" aria-label="Vergrößern">+</button><button id="fit">Einpassen</button></div><div id="empty" hidden></div></section>
<aside id="editor" hidden><div class="editorHead"><div><small id="filePath"></small><h2 id="fileTitle"></h2></div><button id="close" aria-label="Editor schließen">×</button></div><div class="versionbar"><label for="versions">Stand</label><select id="versions"><option value="">Aktuell</option></select></div><div id="editNotice" role="status"></div><textarea id="content" aria-label="Markdown-Inhalt" spellcheck="false"></textarea><footer><span id="dirty">Gespeichert</span><button id="save" class="primary">Speichern</button><button id="restore" class="primary" hidden>Als aktuellen Stand übernehmen</button></footer></aside></main>
<dialog id="newFile"><form id="newForm"><h2>Datei hinzufügen</h2><label>Name<input name="name" required placeholder="NOTES.md" pattern="[^/\\]+\.md"></label><label>Ordner<select name="parent" id="parent"></select></label><label>Vorhandene .md importieren<input id="import" type="file" accept=".md,text/markdown,text/plain"></label><label>Inhalt<textarea name="content" rows="8" spellcheck="false"></textarea></label><div class="actions"><button type="button" id="cancelNew">Abbrechen</button><button class="primary">Hinzufügen</button></div></form></dialog>
<div id="toast" role="alert" hidden></div><script type="module" src="/app.js"></script></body></html>
